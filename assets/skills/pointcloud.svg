<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgPC)"/>
  <!-- 3D Voxel Grid & Point Cloud Elevation Color Ramp -->
  <g opacity="0.25">
    <!-- Isometric 3D Bounding Box / Voxel Wireframe -->
    <path d="M 300,100 L 460,180 L 300,260 L 140,180 Z" stroke="#818cf8" stroke-width="1.5" fill="none"/>
    <path d="M 140,180 L 140,290 L 300,370 L 300,260" stroke="#818cf8" stroke-width="1.5" fill="none"/>
    <path d="M 460,180 L 460,290 L 300,370" stroke="#818cf8" stroke-width="1.5" fill="none"/>
    <!-- Point Cloud Nodes with RGB / Intensity Elevation Color Ramp -->
    <circle cx="260" cy="220" r="3.5" fill="#f43f5e"/><circle cx="280" cy="210" r="3" fill="#fb923c"/>
    <circle cx="300" cy="200" r="3.5" fill="#facc15"/><circle cx="320" cy="210" r="3" fill="#4ade80"/>
    <circle cx="340" cy="225" r="3.5" fill="#38bdf8"/><circle cx="280" cy="250" r="3" fill="#818cf8"/>
    <circle cx="310" cy="245" r="3.5" fill="#c084fc"/><circle cx="330" cy="270" r="3" fill="#38bdf8"/>
    <circle cx="250" cy="275" r="3.5" fill="#4ade80"/><circle cx="290" cy="300" r="3" fill="#facc15"/>
  </g>
</svg>