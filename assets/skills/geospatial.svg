<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGeo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGeo)"/>
  <!-- GIS Map Polygon Layers & Coordinate Grid -->
  <g stroke="#34d399" stroke-width="1.2" fill="none" opacity="0.25">
    <!-- Geospatial Polygon Boundaries -->
    <polygon points="60,80 180,60 220,150 140,200 70,160" fill="#059669" fill-opacity="0.15"/>
    <polygon points="180,60 320,40 360,140 220,150" fill="#10b981" fill-opacity="0.15"/>
    <polygon points="220,150 360,140 420,240 280,260 140,200" fill="#34d399" fill-opacity="0.12"/>
    <polygon points="280,260 420,240 480,330 310,360" fill="#047857" fill-opacity="0.18"/>
    <!-- River Vector Polyline -->
    <path d="M 40,30 Q 140,110 200,160 T 310,230 T 490,280 T 560,370" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>
    <!-- North Arrow Watermark -->
    <g transform="translate(520,70)" stroke="#6ee7b7" stroke-width="1.5">
      <polygon points="0,-30 -8,10 0,0 8,10" fill="#34d399"/>
      <text x="-4" y="-35" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">N</text>
    </g>
  </g>
</svg>