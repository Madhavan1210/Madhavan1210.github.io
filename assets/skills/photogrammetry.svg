<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#701a75" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgPhoto)"/>
  <!-- Aerial Photogrammetry Bundle Adjustment & Camera Pyramids -->
  <g stroke="#e879f9" stroke-width="1.3" fill="none" opacity="0.25">
    <!-- Camera Position 1 -->
    <polygon points="120,60 100,100 140,100"/>
    <line x1="120" y1="60" x2="260" y2="280"/><line x1="120" y1="60" x2="340" y2="280"/>
    <!-- Camera Position 2 -->
    <polygon points="300,50 280,90 320,90"/>
    <line x1="300" y1="50" x2="260" y2="280"/><line x1="300" y1="50" x2="340" y2="280"/><line x1="300" y1="50" x2="420" y2="290"/>
    <!-- Camera Position 3 -->
    <polygon points="480,60 460,100 500,100"/>
    <line x1="480" y1="60" x2="340" y2="280"/><line x1="480" y1="60" x2="420" y2="290"/>
    <!-- 3D Tie Points on Surface -->
    <circle cx="260" cy="280" r="4" fill="#f0abfc"/><circle cx="340" cy="280" r="4" fill="#f0abfc"/><circle cx="420" cy="290" r="4" fill="#f0abfc"/>
  </g>
</svg>