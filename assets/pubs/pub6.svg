    <line x1="20" y1="130" x2="145" y2="130" stroke="#64748b"/>
    <line x1="20" y1="30" x2="20" y2="130" stroke="#64748b"/>
    <path d="M 20,40 Q 90,45 115,85 T 145,128" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="65" y="70" font-size="8" fill="#1d4ed8" font-weight="bold">AUC: 0.94</text>
  </g>
  <rect x="25" y="225" width="350" height="25" fill="#eff6ff" rx="4"/>
  <text x="35" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#1e40af">ISPRS Archives 2025 &bull; Cross-Domain Urban &amp; Heritage Point Clouds</text>
