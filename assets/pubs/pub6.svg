<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="25" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Cross-Domain 3M &amp; ArCHX Benchmark Accuracy (OA / mIoU)</text>
  <!-- Confusion Matrix & Benchmark Graph -->
  <g transform="translate(30,40)">
    <rect width="160" height="150" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="12" y="18" font-size="9" font-weight="bold" fill="#334155">Benchmark Transfer</text>
    <rect x="25" y="35" width="50" height="40" fill="#2563eb"/><text x="35" y="60" fill="#ffffff" font-size="10" font-weight="bold">92.1%</text>
    <rect x="80" y="35" width="50" height="40" fill="#93c5fd"/><text x="90" y="60" fill="#1e3a8a" font-size="10" font-weight="bold">81.4%</text>
    <rect x="25" y="80" width="50" height="40" fill="#93c5fd"/><text x="35" y="105" fill="#1e3a8a" font-size="10" font-weight="bold">78.6%</text>
    <rect x="80" y="80" width="50" height="40" fill="#2563eb"/><text x="90" y="105" fill="#ffffff" font-size="10" font-weight="bold">89.7%</text>
    <text x="30" y="135" font-size="7" fill="#64748b">3M Domain &bull; ArCHX</text>
  </g>
  <g transform="translate(205,40)">
    <rect width="165" height="150" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
