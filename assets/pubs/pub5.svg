<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <rect x="25" y="25" width="180" height="190" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="35" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">GIS Route Network &amp; Risk Cost</text>
  <!-- Road Network Lines -->
  <line x1="45" y1="80" x2="110" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="80" x2="180" y2="100" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/><text x="140" y="85" font-size="7" fill="#dc2626">High Risk</text>
  <line x1="45" y1="80" x2="70" y2="150" stroke="#10b981" stroke-width="3"/>
  <line x1="70" y1="150" x2="130" y2="160" stroke="#10b981" stroke-width="3"/>
  <line x1="130" y1="160" x2="180" y2="100" stroke="#10b981" stroke-width="3"/><text x="95" y="175" font-size="7" fill="#059669" font-weight="bold">Optimal Route</text>
  <circle cx="45" cy="80" r="6" fill="#2563eb"/><text x="40" y="70" font-size="8" font-weight="bold" fill="#1e40af">Origin</text>
  <circle cx="180" cy="100" r="6" fill="#dc2626"/><text x="160" y="120" font-size="8" font-weight="bold" fill="#991b1b">Disposal</text>

  <rect x="220" y="25" width="155" height="190" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="230" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Multi-Criteria Score</text>
  <!-- Bar Comparison -->
  <rect x="240" y="140" width="30" height="40" fill="#ef4444"/><text x="242" y="132" font-size="8">Route A</text>
  <rect x="285" y="110" width="30" height="70" fill="#f59e0b"/><text x="287" y="102" font-size="8">Route B</text>
  <rect x="330" y="70" width="30" height="110" fill="#10b981"/><text x="332" y="62" font-size="8">Route C</text>
  <line x1="235" y1="180" x2="365" y2="180" stroke="#64748b"/>

  <rect x="25" y="225" width="350" height="25" fill="#f8fafc" rx="4"/>
  <text x="35" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#1e293b">Environ. Monit. Assess. 2024 &bull; Risk Analysis of Waste Route Choices</text>
</svg>