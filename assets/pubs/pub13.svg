<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="25" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Geochemical Analysis &amp; Seawater Intrusion (Chennai Coast)</text>
  <!-- Piper Trilinear Diagram Skeleton -->
  <g transform="translate(30,45)">
    <rect width="165" height="150" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="10" y="16" font-size="8" font-weight="bold" fill="#334155">Piper Trilinear Plot</text>
    <!-- Left Cation Triangle -->
    <polygon points="45,120 85,55 125,120" stroke="#0284c7" stroke-width="1.2" fill="none"/>
    <circle cx="95" cy="85" r="3" fill="#dc2626"/>
    <circle cx="80" cy="100" r="3" fill="#0284c7"/>
    <circle cx="70" cy="110" r="3" fill="#0284c7"/>
    <text x="75" y="135" font-size="7">Ca + Mg</text>
  </g>
  <!-- Coastal Salinity Iso-contour Map -->
  <g transform="translate(205,45)">
    <rect width="165" height="150" fill="#f0f9ff" stroke="#bae6fd" rx="4"/>
    <text x="10" y="16" font-size="8" font-weight="bold" fill="#0369a1">Coastal Salinity Contours</text>
    <path d="M 120,25 Q 115,80 135,145" stroke="#0284c7" stroke-width="3" fill="none"/>
    <text x="130" y="90" font-size="7" fill="#0369a1" font-weight="bold">Coastline</text>
    <!-- Intrusion Contours -->
    <path d="M 90,30 Q 80,80 100,140" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <path d="M 60,35 Q 50,85 70,135" stroke="#ef4444" stroke-width="2" fill="none"/>
    <text x="25" y="70" font-size="7" fill="#b91c1c">High TDS</text>
  </g>
  <rect x="25" y="225" width="350" height="25" fill="#f0fdf4" rx="4"/>
  <text x="35" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#166534">SPICE 2023 &bull; Seawater Intrusion Geochemical Analysis</text>
</svg>