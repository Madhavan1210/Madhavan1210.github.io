<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="25" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38bdf8">3D Semantic Segmentation &bull; Heritage Point Cloud</text>
  <!-- Segmented Temple Architecture Elevation -->
  <g transform="translate(100,50)">
    <!-- Shikhara / Dome (Class: Shikhara - Red) -->
