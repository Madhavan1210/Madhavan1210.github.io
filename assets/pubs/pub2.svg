    <circle cx="100" cy="-5" r="5" fill="#facc15"/>
    <!-- Mandapa Roof (Class: Roof - Blue) -->
    <polygon points="30,90 170,90 190,115 10,115" fill="#3b82f6" opacity="0.85"/>
    <!-- Pillars (Class: Column - Green) -->
    <rect x="25" y="115" width="12" height="65" fill="#22c55e"/>
    <rect x="65" y="115" width="12" height="65" fill="#22c55e"/>
    <rect x="123" y="115" width="12" height="65" fill="#22c55e"/>
    <rect x="163" y="115" width="12" height="65" fill="#22c55e"/>
    <!-- Plinth / Base (Class: Plinth - Yellow) -->
    <rect x="0" y="180" width="200" height="18" fill="#eab308"/>
  </g>
  <!-- Semantic Class Color Legend on Right -->
  <g transform="translate(310,65)" font-family="sans-serif" font-size="9" fill="#e2e8f0">
    <rect x="0" y="0" width="10" height="10" fill="#ef4444"/><text x="16" y="9">Shikhara (94.2%)</text>
    <rect x="0" y="20" width="10" height="10" fill="#3b82f6"/><text x="16" y="29">Roof (91.8%)</text>
    <rect x="0" y="40" width="10" height="10" fill="#22c55e"/><text x="16" y="49">Pillars (96.5%)</text>
    <rect x="0" y="60" width="10" height="10" fill="#eab308"/><text x="16" y="69">Plinth (95.1%)</text>
    <text x="0" y="100" font-weight="bold" fill="#38bdf8">mIoU: 92.4%</text>
  </g>
  <rect x="20" y="225" width="360" height="25" fill="#1e293b" rx="4"/>
  <text x="30" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">Measurement 2026 &bull; Deep Learning 3D Reconstruction</text>
</svg>