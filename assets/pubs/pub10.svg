<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="25" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">3DITA – Nagara-Style Indian Temple 3D Benchmark Dataset</text>
  <!-- Temple 3D Wireframe / Segmented Classes -->
  <g transform="translate(110,40)">
    <!-- Shikhara (Latina/Shekhari style) -->
    <path d="M 90,0 Q 120,40 135,100 L 45,100 Q 60,40 90,0 Z" stroke="#b45309" stroke-width="2" fill="#fef3c7"/>
    <!-- Amalaka Disc & Kalasha -->
    <ellipse cx="90" cy="-2" rx="14" ry="4" fill="#d97706"/>
    <circle cx="90" cy="-10" r="4" fill="#b45309"/>
    <!-- Urushringa Miniature Spires -->
    <path d="M 60,70 Q 75,50 80,70 Z" fill="#f59e0b" stroke="#b45309"/>
    <path d="M 100,70 Q 105,50 120,70 Z" fill="#f59e0b" stroke="#b45309"/>
    <!-- Antarala & Mandapa Roof -->
    <polygon points="20,100 160,100 180,130 0,130" fill="#fed7aa" stroke="#c2410c"/>
    <!-- Carved Base & Plinth -->
    <rect x="-10" y="130" width="200" height="35" fill="#e2e8f0" stroke="#475569"/>
    <!-- Columns -->
    <rect x="15" y="130" width="10" height="30" fill="#94a3b8"/>
    <rect x="55" y="130" width="10" height="30" fill="#94a3b8"/>
    <rect x="115" y="130" width="10" height="30" fill="#94a3b8"/>
    <rect x="155" y="130" width="10" height="30" fill="#94a3b8"/>
  </g>
  <rect x="25" y="225" width="350" height="25" fill="#fffbeb" rx="4"/>
  <text x="35" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#92400e">ISPRS Archives &bull; CIPA 2025 &bull; 3DITA Indian Temple Dataset</text>
</svg>