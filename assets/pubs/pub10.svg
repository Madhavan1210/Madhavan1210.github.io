<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="25" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Tracking 200 Years of Urban Growth Dynamics (1820–2020)</text>
  <!-- Multi-Temporal Growth Curve -->
  <g transform="translate(35,45)">
    <rect width="330" height="150" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <line x1="40" y1="125" x2="310" y2="125" stroke="#64748b"/>
    <line x1="40" y1="20" x2="40" y2="125" stroke="#64748b"/>
    <text x="35" y="140" font-size="8">1820</text>
    <text x="110" y="140" font-size="8">1870</text>
    <text x="180" y="140" font-size="8">1920</text>
    <text x="250" y="140" font-size="8">1970</text>
    <text x="295" y="140" font-size="8">2020</text>
    <!-- Growth Trajectory -->
    <path d="M 40,120 L 110,115 L 180,105 L 250,75 L 305,25" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="40" cy="120" r="3" fill="#b91c1c"/>
    <circle cx="110" cy="115" r="3" fill="#b91c1c"/>
    <circle cx="180" cy="105" r="3" fill="#b91c1c"/>
    <circle cx="250" cy="75" r="3" fill="#b91c1c"/>
    <circle cx="305" cy="25" r="4" fill="#b91c1c"/>
    <text x="210" y="45" font-size="8" fill="#991b1b" font-weight="bold">Exponential Sprawl</text>
  </g>
  <rect x="25" y="225" width="350" height="25" fill="#fef2f2" rx="4"/>
  <text x="35" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#991b1b">44th INCA Congress 2024 &bull; Urban Growth from Historical Maps</text>
</svg>