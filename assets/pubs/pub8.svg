<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="25" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f172a">TLS Point Cloud to Historic BIM (HBIM) Pipeline</text>
  <!-- Step 1: Raw LiDAR Point Cloud -->
  <g transform="translate(25,40)">
    <rect width="95" height="150" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="8" y="16" font-size="8" font-weight="bold" fill="#334155">1. Raw TLS Cloud</text>
    <g fill="#0284c7" opacity="0.6">
      <circle cx="20" cy="40" r="1.5"/><circle cx="35" cy="35" r="1.5"/><circle cx="50" cy="42" r="1.5"/><circle cx="70" cy="38" r="1.5"/>
      <circle cx="25" cy="70" r="1.5"/><circle cx="45" cy="65" r="1.5"/><circle cx="65" cy="72" r="1.5"/><circle cx="75" cy="90" r="1.5"/>
      <circle cx="20" cy="110" r="1.5"/><circle cx="50" cy="115" r="1.5"/><circle cx="75" cy="110" r="1.5"/>
    </g>
  </g>
  <text x="127" y="120" font-size="16" fill="#64748b">→</text>
  <!-- Step 2: Surface Mesh Reconstruction -->
  <g transform="translate(145,40)">
    <rect width="105" height="150" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="8" y="16" font-size="8" font-weight="bold" fill="#334155">2. 3D Triangular Mesh</text>
    <path d="M 20,130 L 52,40 L 85,130 Z" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
    <line x1="52" y1="40" x2="52" y2="130" stroke="#3b82f6"/>
    <line x1="36" y1="85" x2="68" y2="85" stroke="#3b82f6"/>
  </g>
  <text x="257" y="120" font-size="16" fill="#64748b">→</text>
  <!-- Step 3: Parametric HBIM Model -->
  <g transform="translate(275,40)">
    <rect width="100" height="150" fill="#eff6ff" stroke="#3b82f6" rx="4"/>
    <text x="8" y="16" font-size="8" font-weight="bold" fill="#1d4ed8">3. Digital Twin</text>
    <polygon points="15,60 50,25 85,60 85,135 15,135" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="35" y="80" width="30" height="55" fill="#ffffff" stroke="#1d4ed8"/>
  </g>
  <rect x="25" y="225" width="350" height="25" fill="#f0f9ff" rx="4"/>
  <text x="35" y="241" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#0369a1">J. Indian Soc. Remote Sens. 2026 &bull; HBIM &amp; Digital Twin Creation</text>
</svg>