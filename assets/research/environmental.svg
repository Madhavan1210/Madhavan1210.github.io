<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgEnv)"/>
  <!-- Drone / UAV Survey over Dump Yard GIS Contour -->
  <g stroke="#86efac" stroke-width="1.3" opacity="0.35" fill="none">
    <!-- Contour heat lines -->
    <ellipse cx="320" cy="240" rx="200" ry="80"/>
    <ellipse cx="320" cy="240" rx="140" ry="55"/>
    <ellipse cx="320" cy="240" rx="80" ry="30"/>
    <!-- Drone Quadcopter in sky -->
    <g transform="translate(160,90)">
      <circle cx="0" cy="0" r="12" fill="#22c55e" opacity="0.4"/>
      <line x1="-30" y1="-20" x2="30" y2="20" stroke="#4ade80" stroke-width="2"/>
      <line x1="-30" y1="20" x2="30" y2="-20" stroke="#4ade80" stroke-width="2"/>
      <circle cx="-30" cy="-20" r="6" fill="#86efac"/><circle cx="30" cy="20" r="6" fill="#86efac"/>
      <circle cx="-30" cy="20" r="6" fill="#86efac"/><circle cx="30" cy="-20" r="6" fill="#86efac"/>
      <!-- Downward sensor telemetry cone -->
      <polygon points="0,10 -60,110 60,110" fill="#22c55e" opacity="0.15" stroke="none"/>
    </g>
  </g>
</svg>