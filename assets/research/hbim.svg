<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHBIM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgHBIM)"/>
  <!-- Nagara Temple 3D Architectural Wireframe / Shikhara Structure -->
  <g stroke="#f472b6" stroke-width="1.3" opacity="0.35" fill="none">
    <!-- Base Plinth (Adhishthana) -->
    <polygon points="120,340 480,340 440,300 160,300"/>
    <line x1="120" y1="340" x2="120" y2="360"/><line x1="480" y1="340" x2="480" y2="360"/><line x1="120" y1="360" x2="480" y2="360"/>
    <!-- Mandapa Pillars -->
    <rect x="180" y="210" width="15" height="90"/>
    <rect x="240" y="210" width="15" height="90"/>
    <rect x="345" y="210" width="15" height="90"/>
    <rect x="405" y="210" width="15" height="90"/>
    <!-- Shikhara Curvilinear Spire -->
    <path d="M 230,210 Q 270,110 300,50 Q 330,110 370,210 Z"/>
    <line x1="250" y1="180" x2="350" y2="180"/>
    <line x1="265" y1="140" x2="335" y2="140"/>
    <line x1="280" y1="100" x2="320" y2="100"/>
    <!-- Kalasha / Finial on top -->
    <circle cx="300" cy="40" r="8"/>
    <line x1="300" y1="32" x2="300" y2="18"/>
  </g>
</svg>