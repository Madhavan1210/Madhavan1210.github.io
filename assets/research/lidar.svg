<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLidar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgLidar)"/>
  <!-- Point Cloud Dots Matrix -->
  <g fill="#4ade80" opacity="0.3">
    <!-- Concentric scanning rings of 3D points -->
    <circle cx="200" cy="180" r="2.5"/><circle cx="240" cy="190" r="3"/><circle cx="280" cy="170" r="2.5"/><circle cx="320" cy="185" r="3"/><circle cx="360" cy="175" r="2"/><circle cx="400" cy="190" r="3"/>
    <circle cx="220" cy="220" r="3"/><circle cx="260" cy="235" r="2.5"/><circle cx="300" cy="210" r="3.5"/><circle cx="340" cy="230" r="3"/><circle cx="380" cy="220" r="2.5"/>
    <circle cx="180" cy="260" r="2.5"/><circle cx="230" cy="275" r="3"/><circle cx="290" cy="255" r="3"/><circle cx="350" cy="270" r="3"/><circle cx="410" cy="260" r="2.5"/>
    <!-- LiDAR laser scanning rays -->
    <line x1="120" y1="80" x2="260" y2="235" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="120" y1="80" x2="300" y2="210" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="120" y1="80" x2="380" y2="220" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <!-- Scanner Tripod Base -->
  <g transform="translate(120,80)" stroke="#86efac" stroke-width="2" opacity="0.45" fill="none">
    <circle cx="0" cy="0" r="14" fill="#14532d"/>
    <line x1="0" y1="14" x2="-20" y2="50"/>
    <line x1="0" y1="14" x2="20" y2="50"/>
    <line x1="0" y1="14" x2="0" y2="52"/>
  </g>
</svg>