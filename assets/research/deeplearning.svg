<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgDL)"/>
  <!-- Neural Network Topology -->
  <g stroke="#c084fc" stroke-width="1.2" opacity="0.3" fill="none">
    <!-- Input to Hidden 1 -->
    <line x1="80" y1="120" x2="220" y2="100"/><line x1="80" y1="120" x2="220" y2="170"/><line x1="80" y1="120" x2="220" y2="240"/>
    <line x1="80" y1="200" x2="220" y2="100"/><line x1="80" y1="200" x2="220" y2="170"/><line x1="80" y1="200" x2="220" y2="240"/><line x1="80" y1="200" x2="220" y2="310"/>
    <line x1="80" y1="280" x2="220" y2="170"/><line x1="80" y1="280" x2="220" y2="240"/><line x1="80" y1="280" x2="220" y2="310"/>
    <!-- Hidden 1 to Hidden 2 -->
    <line x1="220" y1="100" x2="380" y2="130"/><line x1="220" y1="170" x2="380" y2="130"/><line x1="220" y1="170" x2="380" y2="210"/>
    <line x1="220" y1="240" x2="380" y2="210"/><line x1="220" y1="240" x2="380" y2="290"/><line x1="220" y1="310" x2="380" y2="290"/>
    <!-- Hidden 2 to Output -->
    <line x1="380" y1="130" x2="520" y2="160"/><line x1="380" y1="210" x2="520" y2="160"/>
    <line x1="380" y1="210" x2="520" y2="250"/><line x1="380" y1="290" x2="520" y2="250"/>
  </g>
  <!-- Node Circles -->
  <g fill="#e9d5ff" opacity="0.45">
    <circle cx="80" cy="120" r="7"/><circle cx="80" cy="200" r="7"/><circle cx="80" cy="280" r="7"/>
    <circle cx="220" cy="100" r="6"/><circle cx="220" cy="170" r="6"/><circle cx="220" cy="240" r="6"/><circle cx="220" cy="310" r="6"/>
    <circle cx="380" cy="130" r="6"/><circle cx="380" cy="210" r="6"/><circle cx="380" cy="290" r="6"/>
    <circle cx="520" cy="160" r="8" fill="#a855f7"/><circle cx="520" cy="250" r="8" fill="#a855f7"/>
  </g>
</svg>