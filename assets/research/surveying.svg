<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSurv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgSurv)"/>
  <!-- Total Station & Geodetic Network -->
  <g stroke="#a5b4fc" stroke-width="1.3" opacity="0.35" fill="none">
    <!-- Triangulation survey mesh -->
    <polygon points="120,280 300,160 480,260"/>
    <polygon points="300,160 480,260 400,340"/>
    <polygon points="120,280 300,160 220,350"/>
    <!-- Total station on tripod -->
    <g transform="translate(300,160)">
      <circle cx="0" cy="-25" r="10" fill="#6366f1" opacity="0.5"/>
      <line x1="-15" y1="-25" x2="15" y2="-25" stroke="#818cf8" stroke-width="3"/>
      <line x1="0" y1="-15" x2="-20" y2="40" stroke="#818cf8" stroke-width="2"/>
      <line x1="0" y1="-15" x2="20" y2="40" stroke="#818cf8" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="42" stroke="#818cf8" stroke-width="2"/>
    </g>
    <!-- Crosshair reticle in corner -->
    <circle cx="480" cy="90" r="35" stroke-dasharray="3,3"/>
    <line x1="440" y1="90" x2="520" y2="90"/>
    <line x1="480" y1="50" x2="480" y2="130"/>
  </g>
</svg>