<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Space & Polar Sea Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="45%" stop-color="#0b1736" />
      <stop offset="70%" stop-color="#0e2347" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>

    <!-- Radar Pulse Wave Gradient -->
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8" />
    </radialGradient>

    <!-- LiDAR Laser Beam Gradient -->
    <linearGradient id="lidarBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.9" />
    </linearGradient>

    <!-- Sea Ice Texture Gradient -->
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Radar pulse emission animation */
    @keyframes pulseWave {
      0% { r: 10px; opacity: 0.9; transform: scale(0.1); }
      70% { opacity: 0.5; }
      100% { r: 480px; opacity: 0; transform: scale(1); }
    }

    /* Satellite slow orbital motion */
    @keyframes satelliteOrbit {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(45px, -15px); }
      100% { transform: translate(0px, 0px); }
    }

    /* LiDAR beam sweep */
    @keyframes lidarSweep {
      0% { transform: rotate(-14deg); opacity: 0.4; }
      50% { transform: rotate(14deg); opacity: 0.9; }
      100% { transform: rotate(-14deg); opacity: 0.4; }
    }

    /* Radar echo waveform oscillation */
    @keyframes waveOsc {
      0% { transform: translateY(0px); opacity: 0.7; }
      50% { transform: translateY(-8px); opacity: 1; }
      100% { transform: translateY(0px); opacity: 0.7; }
    }

    /* Sea ice floating drift */
    @keyframes iceDrift {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-25px); }
      100% { transform: translateX(0px); }
    }

    .pulse-ring-1 {
      animation: pulseWave 4s cubic-bezier(0.1, 0.7, 0.4, 1) infinite;
      transform-origin: 960px 140px;
    }
    .pulse-ring-2 {
      animation: pulseWave 4s cubic-bezier(0.1, 0.7, 0.4, 1) infinite 1.3s;
      transform-origin: 960px 140px;
    }
    .pulse-ring-3 {
      animation: pulseWave 4s cubic-bezier(0.1, 0.7, 0.4, 1) infinite 2.6s;
      transform-origin: 960px 140px;
    }
    .sat-group {
      animation: satelliteOrbit 16s ease-in-out infinite;
    }
    .lidar-beam-group {
      transform-origin: 960px 140px;
      animation: lidarSweep 8s ease-in-out infinite;
    }
    .waveform-graph {
      animation: waveOsc 3s ease-in-out infinite;
    }
    .ice-floes {
      animation: iceDrift 20s ease-in-out infinite;
    }
  </style>

  <!-- Deep Arctic Atmosphere Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Constellation / Spatial Coordinate Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" stroke-dasharray="4,8">
    <line x1="0" y1="200" x2="1920" y2="200" />
    <line x1="0" y1="400" x2="1920" y2="400" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="800" x2="1920" y2="800" />
    <line x1="320" y1="0" x2="320" y2="1080" />
    <line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>

  <!-- Sea Surface & Underwater Draft Layer -->
  <rect x="0" y="740" width="1920" height="340" fill="url(#oceanGrad)" />

  <!-- Sea Ice Floes with Freeboard & Thickness Layers -->
  <g class="ice-floes">
    <!-- Submerged Ice Draft -->
    <path d="M 120 740 Q 240 820 400 800 T 700 830 T 1000 810 T 1320 840 T 1650 810 T 1880 770 L 1880 740 Z" fill="#0284c7" opacity="0.45" />
    
    <!-- Surface Sea Ice Floe 1 -->
    <polygon points="100,740 180,685 360,680 440,740 380,755 160,755" fill="url(#iceGrad)" stroke="#bae6fd" stroke-width="1.5" filter="url(#glow)" />
    <!-- Snow Cover Layer -->
    <path d="M 180,685 Q 270,675 360,680 L 350,688 Q 270,682 190,690 Z" fill="#ffffff" opacity="0.9" />

    <!-- Surface Sea Ice Floe 2 (Large Pack Ice) -->
    <polygon points="480,740 580,670 780,660 920,685 1060,670 1140,740 1020,760 620,760" fill="url(#iceGrad)" stroke="#bae6fd" stroke-width="1.5" filter="url(#glow)" />
    <!-- Pressure Ridge on Sea Ice -->
    <path d="M 680,665 L 730,645 L 770,662 L 820,648 L 860,668" stroke="#f0f9ff" stroke-width="3" fill="none" opacity="0.9" />
    <!-- Sea Ice Thickness Annotation line -->
    <line x1="780" y1="655" x2="780" y2="825" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="780" cy="655" r="3" fill="#38bdf8" />
    <circle cx="780" cy="825" r="3" fill="#38bdf8" />
    <text x="795" y="745" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">Sea Ice Thickness (hi)</text>

    <!-- Surface Sea Ice Floe 3 -->
    <polygon points="1200,740 1280,680 1480,675 1620,740 1510,755 1290,755" fill="url(#iceGrad)" stroke="#bae6fd" stroke-width="1.5" filter="url(#glow)" />
    <path d="M 1280,680 Q 1380,670 1480,675 L 1470,684 Q 1380,678 1290,685 Z" fill="#ffffff" opacity="0.85" />
    
    <!-- Open Lead / Water Polarity (Reflects Altimeter Specular Echo) -->
    <ellipse cx="1170" cy="742" rx="45" ry="5" fill="#38bdf8" opacity="0.7" filter="url(#glow)" />
    <text x="1140" y="775" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11">Lead (Specular)</text>
  </g>

  <!-- Radar Altimetry Expanding Wave Pulses -->
  <g>
    <circle cx="960" cy="140" r="10" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-ring-1" opacity="0.8" />
    <circle cx="960" cy="140" r="10" fill="none" stroke="#60a5fa" stroke-width="2" class="pulse-ring-2" opacity="0.8" />
    <circle cx="960" cy="140" r="10" fill="none" stroke="#0284c7" stroke-width="2" class="pulse-ring-3" opacity="0.8" />
  </g>

  <!-- LiDAR Green Laser Beam (Altimetry / Profiler) -->
  <g class="lidar-beam-group">
    <polygon points="958,140 962,140 1020,720 900,720" fill="url(#lidarBeam)" opacity="0.5" />
    <line x1="960" y1="140" x2="960" y2="720" stroke="#4ade80" stroke-width="2" filter="url(#glow)" opacity="0.8" />
    <ellipse cx="960" cy="720" rx="20" ry="6" fill="#86efac" opacity="0.9" filter="url(#glow)" />
  </g>

  <!-- Radar Footprint / SAR Swath Cone on Ice -->
  <polygon points="960,140 540,735 1380,735" fill="url(#radarPulse)" opacity="0.22" />

  <!-- SATELLITE (CryoSat-2 / ICESat-2 / SAR Platform) -->
  <g class="sat-group">
    <!-- Orbital Velocity Vector Line -->
    <line x1="840" y1="165" x2="1080" y2="115" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="6,6" />

    <!-- Satellite Body -->
    <g transform="translate(960, 140) rotate(-12)">
      <!-- Left Solar Array Panel -->
      <rect x="-115" y="-14" width="85" height="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" rx="3" />
      <line x1="-86" y1="-14" x2="-86" y2="14" stroke="#60a5fa" stroke-width="1" />
      <line x1="-58" y1="-14" x2="-58" y2="14" stroke="#60a5fa" stroke-width="1" />
      <line x1="-115" y1="0" x2="-30" y2="0" stroke="#93c5fd" stroke-width="1" />

      <!-- Satellite Core Bus -->
      <rect x="-28" y="-18" width="56" height="36" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" rx="4" />
      <rect x="-18" y="-12" width="36" height="24" fill="#2563eb" rx="2" />
      
      <!-- Right Solar Array Panel -->
      <rect x="30" y="-14" width="85" height="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" rx="3" />
      <line x1="58" y1="-14" x2="58" y2="14" stroke="#60a5fa" stroke-width="1" />
      <line x1="86" y1="-14" x2="86" y2="14" stroke="#60a5fa" stroke-width="1" />
      <line x1="30" y1="0" x2="115" y2="0" stroke="#93c5fd" stroke-width="1" />

      <!-- Dual Radar Altimeter Antennas (SARIn Mode) -->
      <ellipse cx="-12" cy="22" rx="7" ry="3" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
      <ellipse cx="12" cy="22" rx="7" ry="3" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Nadir Antenna Feed -->
      <polygon points="0,18 -5,26 5,26" fill="#38bdf8" />
    </g>
    <!-- Label -->
    <text x="980" y="105" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">SAR / Radar Altimetry (Ku/Ka-band)</text>
  </g>

  <!-- Live Radar Altimeter Echo Waveform Display (HUD) in Bottom Right -->
  <g class="waveform-graph" transform="translate(1420, 840)">
    <!-- HUD Box -->
    <rect x="0" y="0" width="440" height="180" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <!-- HUD Header -->
    <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RADAR ECHO WAVEFORM &bull; ALTIMETRY</text>
    <text x="320" y="30" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11">● LIVE SCAN</text>

    <!-- Waveform Axis Lines -->
    <line x1="30" y1="145" x2="410" y2="145" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <line x1="30" y1="45" x2="30" y2="145" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

    <!-- Specular / Diffuse Waveform Shape (Leading edge + Trailing edge) -->
    <path d="M 30,145 L 90,144 L 140,142 L 170,120 L 195,55 L 210,75 L 250,98 L 300,118 L 360,135 L 410,142" 
          fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- Peak Retracking Point -->
    <circle cx="195" cy="55" r="5" fill="#f43f5e" filter="url(#glow)" />
    <line x1="195" y1="55" x2="195" y2="145" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="205" y="65" fill="#fda4af" font-family="'JetBrains Mono', monospace" font-size="10">Leading Edge / Re-track</text>
    <text x="40" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Gate / Time Delay</text>
    <text x="310" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Power Echo (dB)</text>
  </g>
</svg>
